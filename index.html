<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #111111;
    --bg-elev-2: #161616;
    --fg: #fafafa;
    --fg-muted: #a1a1a1;
    --fg-dim: #666666;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --accent: oklch(0.75 0.18 250);
    --accent-soft: oklch(0.75 0.18 250 / 0.15);
    --accent-glow: oklch(0.75 0.18 250 / 0.35);
    --success: oklch(0.78 0.15 150);
    --warn: oklch(0.82 0.15 75);
    --sans: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; cursor: default; }
  ::selection { background: var(--accent-soft); color: var(--fg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

  /* Background canvas + grid */
  #particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  #sphere {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.9;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 0%, transparent 100%);
    opacity: 0.6;
  }
  .noise {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIyIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI24pIiBvcGFjaXR5PSIxIi8+PC9zdmc+");
    mix-blend-mode: overlay;
  }

  /* Spotlight follows mouse */
  .spotlight {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), oklch(0.75 0.18 250 / 0.08), transparent 60%);
    transition: background-position 0.1s;
  }

  .app { position: relative; z-index: 3; }

  /* Header */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    background: color-mix(in oklab, var(--bg) 70%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; letter-spacing: -0.01em; }
  .brand-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 16px var(--accent-glow); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
  .nav-links { display: flex; gap: 4px; font-family: var(--mono); font-size: 12px; }
  .nav-links a {
    color: var(--fg-muted); text-decoration: none;
    padding: 6px 12px; border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }
  .nav-links a:hover { color: var(--fg); background: var(--bg-elev-2); }
  .nav-cta {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px;
    padding: 6px 10px 6px 12px; border: 1px solid var(--line-strong); border-radius: 8px;
    color: var(--fg-muted); cursor: pointer; background: transparent;
    transition: all 0.2s;
  }
  .nav-cta:hover { border-color: var(--fg-muted); color: var(--fg); }
  .kbd {
    font-family: var(--mono); font-size: 10px;
    padding: 2px 6px; border: 1px solid var(--line-strong); border-radius: 4px;
    background: var(--bg-elev); color: var(--fg-muted);
  }

  /* Generic section */
  section { max-width: 1200px; margin: 0 auto; padding: 96px 32px; position: relative; }
  .section-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::before {
    content: ''; width: 16px; height: 1px; background: var(--accent);
  }
  .section-title {
    font-size: clamp(28px, 4vw, 44px); font-weight: 500; letter-spacing: -0.03em;
    margin-bottom: 12px;
  }
  .section-sub { color: var(--fg-muted); font-size: 16px; max-width: 620px; line-height: 1.6; }

  /* Hero */
  .hero { padding-top: 80px; padding-bottom: 80px; min-height: 92vh; display: flex; align-items: center; }
  .hero-inner { width: 100%; display: grid; grid-template-columns: 1.3fr 1fr; gap: 64px; align-items: center; }
  @media (max-width: 960px) { .hero-inner { grid-template-columns: 1fr; } }

  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg-elev);
  }
  .hero-tag .live {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }
  .hero h1 {
    margin-top: 24px;
    font-size: clamp(40px, 7vw, 84px); font-weight: 500;
    letter-spacing: -0.04em; line-height: 1; text-wrap: balance;
  }
  .hero h1 .grad {
    background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 60%, var(--fg-muted) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shift 8s ease-in-out infinite;
  }
  @keyframes shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero-sub {
    margin-top: 24px; color: var(--fg-muted);
    font-size: 18px; line-height: 1.6; max-width: 540px;
  }
  .hero-meta {
    margin-top: 32px; display: flex; flex-wrap: wrap; gap: 24px;
    font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
  }
  .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .hero-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--fg-dim); }
  .hero-cta { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    padding: 12px 20px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 0.2s; border: 1px solid transparent;
    text-decoration: none;
  }
  .btn-primary { background: var(--fg); color: var(--bg); }
  .btn-primary:hover { background: var(--accent); color: var(--fg); transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }
  .btn-ghost:hover { border-color: var(--fg-muted); background: var(--bg-elev); }

  /* Terminal card (hero right) */
  .terminal {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.02);
    font-family: var(--mono); font-size: 13px;
    position: relative;
  }
  .terminal::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), var(--accent-soft), transparent 40%);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .terminal:hover::before { opacity: 1; }
  .term-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
  }
  .term-head .dots { display: flex; gap: 6px; }
  .term-head .dots span {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }
  .term-title { font-size: 11px; color: var(--fg-dim); margin-left: 8px; }
  .term-body { padding: 18px; min-height: 280px; }
  .term-line { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; line-height: 1.6; }
  .term-prompt { color: var(--accent); flex-shrink: 0; }
  .term-out { color: var(--fg-muted); }
  .term-key { color: var(--fg); }
  .term-val { color: var(--success); }
  .term-warn { color: var(--warn); }
  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--fg); vertical-align: middle; margin-left: 2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Stats strip */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-elev);
    overflow: hidden;
    margin-top: 80px;
  }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { padding: 28px; border-right: 1px solid var(--line); position: relative; }
  .stat:last-child { border-right: none; }
  @media (max-width: 720px) { .stat:nth-child(2) { border-right: none; } .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--line); } }
  .stat-val {
    font-family: var(--mono); font-size: clamp(28px, 4vw, 40px); font-weight: 500;
    letter-spacing: -0.02em; line-height: 1;
    background: linear-gradient(180deg, var(--fg), var(--fg-muted));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat-lbl { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Experience timeline */
  .timeline { margin-top: 48px; position: relative; }
  .job {
    display: grid; grid-template-columns: 200px 1fr; gap: 48px;
    padding: 32px 0; border-top: 1px solid var(--line);
    position: relative;
    transition: background 0.3s;
  }
  @media (max-width: 820px) { .job { grid-template-columns: 1fr; gap: 16px; } }
  .job:hover { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.015) 30%, rgba(255,255,255,0.015) 70%, transparent); }
  .job-date {
    font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
    padding-top: 6px;
  }
  .job-date .range { color: var(--fg); }
  .job-date .dur { display: block; margin-top: 4px; color: var(--fg-dim); font-size: 11px; }
  .job-role {
    font-size: 22px; font-weight: 500; letter-spacing: -0.02em;
  }
  .job-co {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    margin-top: 4px;
  }
  .job-co .loc { color: var(--fg-dim); }
  .job-desc { margin-top: 12px; color: var(--fg-muted); font-size: 14px; line-height: 1.6; max-width: 720px; }
  .job-bullets {
    margin-top: 20px;
    display: grid; gap: 2px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.5s ease, opacity 0.3s ease, margin-top 0.3s ease;
  }
  .job.open .job-bullets { max-height: 1200px; opacity: 1; margin-top: 20px; }
  .bullet {
    display: grid; grid-template-columns: 24px 1fr; gap: 12px;
    padding: 10px 0; font-size: 14px; line-height: 1.6; color: var(--fg-muted);
    border-bottom: 1px dashed var(--line);
  }
  .bullet:last-child { border-bottom: none; }
  .bullet-mark { font-family: var(--mono); font-size: 11px; color: var(--accent); padding-top: 4px; }
  .bullet strong { color: var(--fg); font-weight: 500; }
  .tech-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tech {
    font-family: var(--mono); font-size: 11px; color: var(--fg-muted);
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: rgba(255,255,255,0.02);
    transition: all 0.2s;
  }
  .tech:hover { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
  .job-toggle {
    font-family: var(--mono); font-size: 11px; color: var(--fg-dim);
    margin-top: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent;
    transition: all 0.2s;
  }
  .job-toggle:hover { color: var(--fg); border-color: var(--line-strong); }
  .job-toggle .arrow { transition: transform 0.3s; }
  .job.open .job-toggle .arrow { transform: rotate(90deg); }

  /* Skills */
  .skills-grid {
    margin-top: 48px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  @media (max-width: 820px) { .skills-grid { grid-template-columns: 1fr; } }
  .skill-card {
    padding: 24px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-elev);
    position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.3s;
  }
  .skill-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), var(--accent-soft), transparent 40%);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .skill-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .skill-card:hover::before { opacity: 1; }
  .skill-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .skill-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent-soft);
    display: grid; place-items: center;
    color: var(--accent);
    font-family: var(--mono); font-size: 13px;
  }
  .skill-title { font-family: var(--mono); font-size: 13px; letter-spacing: -0.01em; }
  .skill-list { display: flex; flex-direction: column; gap: 10px; }
  .skill-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .skill-name { color: var(--fg); font-family: var(--mono); }
  .skill-bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; max-width: 120px; }
  .skill-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-glow));
    border-radius: 2px;
    transform: translateX(-100%);
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .skill-card.in .skill-fill { transform: translateX(0); }
  .skill-yrs { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); min-width: 32px; text-align: right; }

  /* Reveal animations */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* Command palette */
  .cmdk-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: grid; place-items: flex-start center;
    padding-top: 15vh;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .cmdk {
    width: min(560px, calc(100% - 32px));
    background: var(--bg-elev);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    overflow: hidden;
    animation: slideUp 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .cmdk-input {
    width: 100%; padding: 16px 20px;
    background: transparent; border: none; outline: none;
    color: var(--fg); font-family: var(--sans); font-size: 15px;
    border-bottom: 1px solid var(--line);
  }
  .cmdk-input::placeholder { color: var(--fg-dim); }
  .cmdk-list { max-height: 360px; overflow-y: auto; padding: 8px; }
  .cmdk-section { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); padding: 12px 12px 6px; }
  .cmdk-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 6px;
    cursor: pointer; font-size: 14px; color: var(--fg-muted);
  }
  .cmdk-item.sel, .cmdk-item:hover { background: var(--bg-elev-2); color: var(--fg); }
  .cmdk-item .ic { width: 20px; height: 20px; display: grid; place-items: center; color: var(--fg-dim); }
  .cmdk-item.sel .ic { color: var(--accent); }
  .cmdk-item .txt { flex: 1; }
  .cmdk-item .hint { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }

  /* Footer */
  footer {
    border-top: 1px solid var(--line);
    margin-top: 48px; padding: 48px 32px;
    max-width: 1200px; margin-left: auto; margin-right: auto;
    display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px; color: var(--fg-dim);
  }
  footer .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--fg-muted); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--accent); }

  /* Section divider: animated line with dot */
  .section-split {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px;
  }
  .section-split .line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line-strong), transparent);
  }

  /* ASCII art */
  .ascii {
    font-family: var(--mono); font-size: 10px; line-height: 1.1;
    color: var(--fg-dim); white-space: pre; opacity: 0.4;
    user-select: none;
  }

  /* Contact section */
  .contact-card {
    margin-top: 48px; padding: 48px;
    border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(135deg, var(--bg-elev), var(--bg-elev-2));
    position: relative; overflow: hidden;
  }
  .contact-card::before {
    content: ''; position: absolute; inset: -1px;
    background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), var(--accent-soft), transparent 40%);
    opacity: 0; transition: opacity 0.3s;
    border-radius: 16px;
  }
  .contact-card:hover::before { opacity: 1; }
  .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; position: relative; }
  @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; } }

<script>
  /* ============ Wireframe rotating sphere (icosphere) ============ */
  (function () {
    const canvas = document.getElementById('sphere');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

    function resize() {
      W = canvas.clientWidth = window.innerWidth;
      H = canvas.clientHeight = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Build icosphere vertices + edges (subdivided icosahedron)
    function buildIcosphere(subdivisions) {
      const t = (1 + Math.sqrt(5)) / 2;
      let verts = [
        [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
        [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
        [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1],
      ].map(v => {
        const l = Math.hypot(v[0], v[1], v[2]);
        return [v[0]/l, v[1]/l, v[2]/l];
      });
      let faces = [
        [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
        [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
        [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
        [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
      ];
      const midCache = new Map();
      function midpoint(a, b) {
        const key = a < b ? a + '_' + b : b + '_' + a;
        if (midCache.has(key)) return midCache.get(key);
        const va = verts[a], vb = verts[b];
        const m = [(va[0]+vb[0])/2, (va[1]+vb[1])/2, (va[2]+vb[2])/2];
        const l = Math.hypot(m[0], m[1], m[2]);
        m[0]/=l; m[1]/=l; m[2]/=l;
        const idx = verts.length;
        verts.push(m);
        midCache.set(key, idx);
        return idx;
      }
      for (let s = 0; s < subdivisions; s++) {
        const out = [];
        for (const f of faces) {
          const a = midpoint(f[0], f[1]);
          const b = midpoint(f[1], f[2]);
          const c = midpoint(f[2], f[0]);
          out.push([f[0], a, c], [f[1], b, a], [f[2], c, b], [a, b, c]);
        }
        faces = out;
      }
      // unique edges
      const edgeSet = new Set();
      const edges = [];
      for (const f of faces) {
        for (let i = 0; i < 3; i++) {
          const a = f[i], b = f[(i+1)%3];
          const k = a < b ? a + '_' + b : b + '_' + a;
          if (!edgeSet.has(k)) { edgeSet.add(k); edges.push([a, b]); }
        }
      }
      return { verts, edges };
    }

    const sphere = buildIcosphere(2); // 162 verts, ~480 edges
    let rot = { x: 0, y: 0 };
    const scroll = { y: 0 };
    window.addEventListener('scroll', () => { scroll.y = window.scrollY; }, { passive: true });

    function tick(t) {
      ctx.clearRect(0, 0, W, H);

      // easing mouse
      mouse.x += (mouse.tx - mouse.x) * 0.04;
      mouse.y += (mouse.ty - mouse.y) * 0.04;

      rot.y = t * 0.00018 + mouse.x * 0.6;
      rot.x = Math.sin(t * 0.00012) * 0.25 + mouse.y * 0.4 + scroll.y * 0.0008;

      const cx = W * 0.78;
      const cy = H * 0.32;
      const radius = Math.min(W, H) * 0.28;
      const perspective = 800;

      const cosY = Math.cos(rot.y), sinY = Math.sin(rot.y);
      const cosX = Math.cos(rot.x), sinX = Math.sin(rot.x);

      const proj = sphere.verts.map(v => {
        // rotate Y
        let x = v[0] * cosY - v[2] * sinY;
        let z = v[0] * sinY + v[2] * cosY;
        let y = v[1];
        // rotate X
        const y2 = y * cosX - z * sinX;
        const z2 = y * sinX + z * cosX;
        y = y2; z = z2;
        // project
        const scale = perspective / (perspective + z * radius);
        return { x: cx + x * radius * scale, y: cy + y * radius * scale, z, scale };
      });

      // edges (z-sorted by midpoint depth for fade)
      ctx.lineWidth = 0.6;
      for (const [a, b] of sphere.edges) {
        const pa = proj[a], pb = proj[b];
        const mz = (pa.z + pb.z) / 2; // -1..1
        const front = (1 - mz) / 2; // 1 front, 0 back
        const alpha = 0.04 + front * 0.35;
        // slight accent bias toward front
        if (front > 0.7) ctx.strokeStyle = `oklch(0.75 0.18 250 / ${alpha})`;
        else ctx.strokeStyle = `rgba(220, 220, 255, ${alpha * 0.7})`;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      // vertex dots on front hemisphere
      for (const p of proj) {
        if (p.z > 0.2) continue;
        const front = (1 - p.z) / 2;
        ctx.fillStyle = `oklch(0.75 0.18 250 / ${0.2 + front * 0.5})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.2 * p.scale, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ============ Particle field: mouse-reactive ============ */
  (function () {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mouse = { x: -9999, y: -9999, down: false };
    const particles = [];
    const COUNT = 90;
    const MAX_DIST = 140;
    const COLOR = 'oklch(0.75 0.18 250)';

    function resize() {
      W = canvas.clientWidth = window.innerWidth;
      H = canvas.clientHeight = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.4 + 0.4,
      });
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX; mouse.y = e.clientY;
      document.documentElement.style.setProperty('--mx', e.clientX + 'px');
      document.documentElement.style.setProperty('--my', e.clientY + 'px');
    });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    // attach to any element we want a local --mx/--my on
    function attachLocalMouse(el) {
      el.addEventListener('mousemove', (e) => {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    }
    // expose
    window.__attachLocalMouse = attachLocalMouse;

    function tick() {
      ctx.clearRect(0, 0, W, H);

      for (const p of particles) {
        // attract/repel around mouse
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        const R = 160;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) || 0.01;
          const force = (1 - d / R) * 0.6 * (mouse.down ? -1.5 : 1);
          p.vx += (dx / d) * force * 0.08;
          p.vy += (dy / d) * force * 0.08;
        }
        p.vx *= 0.96; p.vy *= 0.96;
        p.x += p.vx; p.y += p.vy;

        // wrap
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // lines between near particles + mouse
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < MAX_DIST) {
            const alpha = (1 - d / MAX_DIST) * 0.18;
            ctx.strokeStyle = `rgba(180, 180, 255, ${alpha})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
        // line to mouse
        const dxm = particles[i].x - mouse.x;
        const dym = particles[i].y - mouse.y;
        const dm = Math.sqrt(dxm * dxm + dym * dym);
        if (dm < 180) {
          const alpha = (1 - dm / 180) * 0.5;
          ctx.strokeStyle = `oklch(0.75 0.18 250 / ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }

      requestAnimationFrame(tick);
    }
    tick();
  })();

  /* ============ Reveal observer ============ */
  window.__installReveal = function () {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal, .skill-card').forEach(el => obs.observe(el));
  };
</script>

const useCountUp = (target, dur = 1600, trigger) => {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!trigger) return;
    const num = parseFloat(String(target).replace(/[^\d.]/g, '')) || 0;
    const t0 = performance.now();
    let raf;
    const step = (t) => {

      const eased = 1 - Math.pow(1 - p, 3);
      setVal(num * eased);
      if (p < 1) raf = requestAnimationFrame(step);

  }, [target, dur, trigger]);

          const { item, complete, chars } = entry;
          if (item.type === 'cmd') {
            const shown = complete ? item.text : item.text.slice(0, chars);
            const showCursor = !complete || (complete && idx === items.length - 1 && item.waitCursor);
            return (
              <div key={idx} className="term-line">
                <span className="term-prompt">λ</span>
                <span className="term-key">{shown}{showCursor && <span className="cursor"></span>}</span>
              </div>
            );
          }
          if (item.type === 'out') {
            const shown = complete ? item.text : item.text.slice(0, chars);
            return (<div key={idx} className="term-line"><span className="term-prompt">›</span><span className="term-out">{shown}</span></div>);
          }
          if (item.type === 'yaml') {
            return (
              <div key={idx}>
                {item.lines.map((pair, i) => (
                  <div className="term-line" key={i}>
                    <span className="term-prompt">·</span>
                    <span><span className="term-key">{pair[0]}</span> <span className="term-val">{pair[1]}</span></span>
                  </div>
                ))}
              </div>
            );
          }
          if (item.type === 'out2') {
            return (
              <div key={idx}>
                {item.lines.map((l, i) => (
                  <div className="term-line" key={i}><span className="term-prompt">·</span><span className="term-out">{l}</span></div>
                ))}
              </div>
            );
          }
          return null;
        })}
        {progress >= TERM_SCRIPT.length && (
          <div className="term-line"><span className="term-prompt">λ</span><span className="term-val">available for senior platform / distributed-systems roles ✓</span></div>
        )}
      </div>
    </div>
  );
}

/* ============ Stats ============ */
function Stats() {
  const ref = useRef(null);

  useEffect(() => {
    const io = new IntersectionObserver(([e]) => e.isIntersecting && setVisible(true), { threshold: 0.3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);

  return (
    <section style={{ paddingTop: 0, paddingBottom: 0 }}>
      <div className="stats reveal" ref={ref}>
        {STATS.map((s, i) => <StatItem key={i} s={s} visible={visible} />)}

  );
}

function StatItem({ s, visible }) {

/* ============ Command palette ============ */
const COMMANDS = [
  { sec: 'navigate', id: 'home', label: 'Jump to top', hint: 'G H', ic: '↑', action: () => window.scrollTo({ top: 0, behavior: 'smooth' }) },
  { sec: 'navigate', id: 'exp', label: 'Experience', hint: 'G E', ic: '◆', action: () => document.getElementById('experience').scrollIntoView({ behavior: 'smooth' }) },
  { sec: 'navigate', id: 'skills', label: 'Skills', hint: 'G S', ic: '◇', action: () => document.getElementById('skills').scrollIntoView({ behavior: 'smooth' }) },
  { sec: 'navigate', id: 'edu', label: 'Education', hint: 'G U', ic: '◐', action: () => document.getElementById('education').scrollIntoView({ behavior: 'smooth' }) },
  { sec: 'navigate', id: 'contact', label: 'Contact', hint: 'G C', ic: '◉', action: () => document.getElementById('contact').scrollIntoView({ behavior: 'smooth' }) },
  { sec: 'actions', id: 'email', label: 'Send email', hint: '↵', ic: '✉', action: () => window.location.href = 'mailto:' + PROFILE.email },
  { sec: 'actions', id: 'tg', label: 'Open Telegram', hint: '↵', ic: '✈', action: () => window.open(PROFILE.telegram, '_blank') },
  { sec: 'actions', id: 'copy', label: 'Copy email to clipboard', hint: '⌘C', ic: '⧉', action: () => { navigator.clipboard.writeText(PROFILE.email); } },
  { sec: 'actions', id: 'print', label: 'Print / save as PDF', hint: '⌘P', ic: '⎙', action: () => window.print() },
];

function CmdK({ open, onClose }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);

  const filtered = useMemo(() => {
    if (!q.trim()) return COMMANDS;
    const t = q.toLowerCase();
    return COMMANDS.filter(c => c.label.toLowerCase().includes(t) || c.id.includes(t));
  }, [q]);

  useEffect(() => { if (open) { setQ(''); setSel(0); requestAnimationFrame(() => inputRef.current && inputRef.current.focus()); } }, [open]);
  useEffect(() => { setSel(0); }, [q]);

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === 'Escape') { onClose(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(filtered.length - 1, s + 1)); }
      if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
      if (e.key === 'Enter') { e.preventDefault(); const item = filtered[sel]; if (item) { item.action(); onClose(); } }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, filtered, sel, onClose]);

  if (!open) return null;
  const grouped = filtered.reduce((acc, c) => ((acc[c.sec] = acc[c.sec] || []).push(c), acc), {});
  let idxCounter = 0;

  return (
    <div className="cmdk-backdrop" onClick={onClose}>
      <div className="cmdk" onClick={(e) => e.stopPropagation()}>
        <input ref={inputRef} className="cmdk-input" placeholder="Search commands, sections, contact…" value={q} onChange={(e) => setQ(e.target.value)} />
        <div className="cmdk-list">
          {filtered.length === 0 && <div className="cmdk-section">No matches</div>}
          {Object.entries(grouped).map(([sec, items]) => (
            <React.Fragment key={sec}>
              <div className="cmdk-section">{sec}</div>
              {items.map((c) => {
                const my = idxCounter++;
                return (
                  <div key={c.id} className={"cmdk-item" + (my === sel ? ' sel' : '')} onMouseEnter={() => setSel(my)} onClick={() => { c.action(); onClose(); }}>
                    <span className="ic">{c.ic}</span>
                    <span className="txt">{c.label}</span>
                    <span className="hint">{c.hint}</span>
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}
